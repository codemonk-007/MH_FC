<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f172a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>GRE 1000 Flashcards v4</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { overscroll-behavior-x: none; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0f172a; color: #e2e8f0; min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; padding: 16px;
  }
  .app { width: 100%; max-width: 760px; }
  header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; flex-wrap: wrap; gap: 8px; }
  h1 { font-size: 18px; font-weight: 600; color: #f1f5f9; display: flex; align-items: center; gap: 8px; }
  .version-badge {
    font-size: 10px; font-weight: 700; letter-spacing: 0.5px;
    background: #6366f1; color: #ffffff;
    padding: 2px 6px; border-radius: 4px;
  }
  .header-right { display: flex; align-items: center; gap: 10px; }
  .stats { font-size: 13px; color: #94a3b8; }
  .progress-bar { width: 100%; height: 6px; background: #1e293b; border-radius: 3px; overflow: hidden; margin-bottom: 16px; }
  .progress-fill { height: 100%; background: linear-gradient(90deg, #6366f1, #8b5cf6); width: 0%; transition: width 0.3s ease; }
  .card {
    position: relative;
    background: #1e293b; border-radius: 16px; padding: 32px 28px;
    min-height: 440px; display: flex; flex-direction: column;
    cursor: pointer; box-shadow: 0 4px 24px rgba(0,0,0,0.3);
    transition: transform 0.15s ease; user-select: none; overflow-y: auto;
    touch-action: pan-y;
    overscroll-behavior-x: none;
  }
  .card:active { transform: scale(0.99); }
  .swipe-overlay {
    position: absolute; inset: 0; border-radius: 16px;
    display: flex; align-items: center; justify-content: center;
    pointer-events: none; z-index: 5; background: transparent;
  }
  .swipe-icon {
    width: 180px; height: 180px; color: #ffffff;
    opacity: 0; filter: drop-shadow(0 6px 18px rgba(0,0,0,0.35));
    will-change: opacity;
  }
  .swipe-icon svg { width: 100%; height: 100%; display: block; }

  .card-body {
    position: relative; z-index: 1;
    display: flex; flex-direction: column;
    flex: 1; justify-content: center;
  }

  .front {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center; gap: 14px;
  }
  .front .word {
    font-size: 44px; font-weight: 700; color: #f8fafc;
    letter-spacing: -0.8px; line-height: 1.15;
  }
  .front .word-meta {
    font-size: 15px; color: #94a3b8; letter-spacing: 0.2px;
  }
  .front .word-meta .pron {
    color: #a5b4fc; font-family: 'Charis SIL', 'Doulos SIL', 'Times New Roman', serif;
  }
  .front .word-meta .sep { color: #475569; margin: 0 8px; }
  .front .hint {
    font-size: 12px; color: #64748b; margin-top: 24px;
  }

  .back {
    display: flex; flex-direction: column;
    align-items: flex-start; text-align: left;
    width: 100%; gap: 18px;
  }
  .back .word-header {
    width: 100%; text-align: center;
    padding-bottom: 16px; border-bottom: 1px solid #334155;
  }
  .back .word {
    font-size: 30px; font-weight: 700; color: #f8fafc;
    letter-spacing: -0.4px; line-height: 1.15;
  }
  .back .word-meta {
    margin-top: 6px; font-size: 14px; color: #94a3b8;
  }
  .back .word-meta .pron {
    color: #a5b4fc; font-family: 'Charis SIL', 'Doulos SIL', 'Times New Roman', serif;
  }
  .back .word-meta .sep { color: #475569; margin: 0 6px; }

  .section { width: 100%; }
  .section-label {
    font-size: 10px; font-weight: 700;
    letter-spacing: 1.6px; text-transform: uppercase;
    color: #64748b; margin-bottom: 6px;
  }
  .section-value {
    font-size: 15px; line-height: 1.55; color: #e2e8f0;
  }
  .section-value.meaning { color: #f1f5f9; font-size: 16px; }
  .section-value.usage {
    color: #cbd5e1; font-style: italic;
    padding-left: 12px; border-left: 3px solid #6366f1;
  }
  .section-value.mnemonic {
    color: #e2e8f0;
    background: rgba(99, 102, 241, 0.10);
    border-left: 3px solid #8b5cf6;
    padding: 10px 14px; border-radius: 6px;
    font-size: 15px; line-height: 1.55;
  }
  .chip-row {
    display: flex; flex-wrap: wrap; gap: 6px 8px;
    align-items: baseline;
  }
  .chip {
    display: inline-block;
    font-size: 14px; font-weight: 500;
    padding: 3px 10px;
    border-radius: 12px;
    line-height: 1.5;
  }
  .chip.syn {
    color: #86efac;
    background: rgba(16, 185, 129, 0.12);
    border: 1px solid rgba(16, 185, 129, 0.25);
  }
  .chip.ant {
    color: #fca5a5;
    background: rgba(220, 38, 38, 0.12);
    border: 1px solid rgba(220, 38, 38, 0.25);
  }

  nav { display: flex; gap: 8px; margin-top: 16px; flex-wrap: wrap; }
  button {
    background: #334155; color: #e2e8f0; border: none; padding: 10px 16px;
    border-radius: 8px; font-size: 14px; cursor: pointer; font-weight: 500;
    transition: background 0.15s; flex: 1; min-width: 100px;
  }
  button:hover { background: #475569; }
  button:active { background: #64748b; }
  button.primary { background: #6366f1; }
  button.primary:hover { background: #4f46e5; }
  button.known { background: #059669; }
  button.known:hover { background: #047857; }
  button.known.active { background: #10b981; }
  button.unknown { background: #dc2626; }
  button.unknown:hover { background: #b91c1c; }
  .controls { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  .controls button { flex: 1; min-width: 90px; font-size: 13px; padding: 8px 12px; }
  .filters { display: flex; gap: 6px; margin-top: 8px; justify-content: center; }
  .filters button { flex: 0; padding: 6px 12px; font-size: 12px; min-width: auto; }
  .filters button.active { background: #6366f1; }
  .error { color: #fca5a5; text-align: center; font-size: 14px; padding: 20px; }
  .settings-btn {
    width: auto; min-width: 0; padding: 6px 10px; font-size: 13px;
    background: #1e293b; color: #94a3b8; border: 1px solid #334155;
    flex: 0 0 auto;
  }
  .settings-btn:hover { background: #334155; color: #e2e8f0; }
  .modal-backdrop {
    display: none; position: fixed; inset: 0; z-index: 1000;
    background: rgba(2, 6, 23, 0.72); backdrop-filter: blur(3px);
    align-items: center; justify-content: center; padding: 16px;
  }
  .modal-backdrop.open { display: flex; }
  .settings-modal {
    width: min(420px, 100%); background: #1e293b; border: 1px solid #334155;
    border-radius: 14px; padding: 18px; box-shadow: 0 20px 60px rgba(0,0,0,0.45);
  }
  .modal-header {
    display: flex; justify-content: space-between; align-items: flex-start;
    gap: 12px; margin-bottom: 18px;
  }
  .modal-title { font-size: 16px; font-weight: 650; color: #f8fafc; }
  .modal-subtitle { margin-top: 4px; font-size: 12px; color: #64748b; }
  .modal-close {
    flex: 0 0 auto; min-width: 32px; width: 32px; height: 32px;
    padding: 0; font-size: 22px; line-height: 1; background: #334155;
  }
  .modal-field { margin-bottom: 14px; }
  .modal-field label {
    display: block; font-size: 11px; text-transform: uppercase;
    letter-spacing: 1px; color: #94a3b8; margin-bottom: 6px; font-weight: 600;
  }
  .modal-field input {
    width: 100%; padding: 10px 11px; border-radius: 8px;
    border: 1px solid #475569; background: #0f172a; color: #e2e8f0;
    outline: none; font-size: 13px;
  }
  .modal-field input:focus { border-color: #6366f1; }
  .field-note { margin-top: 5px; font-size: 11px; color: #64748b; }
  .modal-actions { display: flex; gap: 8px; margin-top: 4px; }
  .modal-actions button { flex: 1; }
  .sync-status {
    min-height: 18px; margin-top: 10px; font-size: 12px;
    line-height: 1.4; color: #94a3b8;
  }
  .sync-status.ok { color: #86efac; }
  .sync-status.err { color: #fca5a5; }
  .clear-btn {
    width: auto; min-width: 0; padding: 6px 9px; margin-top: 4px;
    background: transparent; color: #64748b; font-size: 11px;
  }
  .clear-btn:hover { background: #334155; color: #cbd5e1; }
  .debug-badge {
    position: fixed; bottom: 8px; right: 8px;
    font-size: 10px; color: #475569;
    background: #0f172a; padding: 3px 6px; border-radius: 4px;
    border: 1px solid #1e293b; z-index: 999;
    font-family: monospace;
    pointer-events: none;
  }
  @media (max-width: 480px) {
    .front .word { font-size: 34px; }
    .back .word { font-size: 24px; }
    .card { padding: 24px 18px; min-height: 380px; }
    button { font-size: 13px; padding: 9px 12px; }
    .swipe-icon { width: 130px; height: 130px; }
    .section-value { font-size: 14px; }
    .section-value.meaning { font-size: 15px; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>GRE 1000 <span class="version-badge">v4</span></h1>
    <div class="header-right">
      <div class="stats" id="stats">loading…</div>
      <button class="settings-btn" onclick="openSettings()" title="GitHub sync settings">⚙ Sync</button>
    </div>
  </header>
  <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>

  <div class="card" id="card">
    <div class="swipe-overlay" id="swipeOverlay">
      <div class="swipe-icon" id="swipeIcon">
        <svg viewBox="0 0 100 100" aria-hidden="true">
          <path id="swipeIconPath"
                d=""
                stroke="currentColor"
                stroke-width="12"
                fill="none"
                stroke-linecap="round"
                stroke-linejoin="round"/>
        </svg>
      </div>
    </div>
    <div class="card-body" id="cardContent">
      <div class="front"><div class="word">Loading…</div></div>
    </div>
  </div>

  <div class="filters">
    <button data-filter="all" class="active" onclick="setFilter('all')">All</button>
    <button data-filter="unknown" onclick="setFilter('unknown')">Unknown</button>
    <button data-filter="known" onclick="setFilter('known')">Known</button>
  </div>

  <nav>
    <button onclick="prev()">← Prev</button>
    <button class="primary" onclick="flip()">Flip</button>
    <button onclick="next()">Next →</button>
  </nav>

  <div class="controls">
    <button class="known" id="knownBtn" onclick="mark('known')">✓ Known</button>
    <button class="unknown" id="unknownBtn" onclick="mark('unknown')">✗ Unknown</button>
    <button onclick="shuffle()">🔀 Shuffle</button>
    <button onclick="reset()">↺ Reset</button>
  </div>

  <div class="modal-backdrop" id="settingsModal" onclick="closeSettingsOnBackdrop(event)">
    <div class="settings-modal">
      <div class="modal-header">
        <div>
          <div class="modal-title">GitHub Sync</div>
          <div class="modal-subtitle">Sync your flashcard progress across devices</div>
        </div>
        <button class="modal-close" onclick="closeSettings()">×</button>
      </div>

      <div class="modal-field">
        <label for="gistUrl">Gist URL</label>
        <input id="gistUrl" type="url" placeholder="https://gist.github.com/username/..." autocomplete="off">
      </div>

      <div class="modal-field">
        <label for="gistToken">GitHub PAT</label>
        <input id="gistToken" type="password" placeholder="GitHub PAT" autocomplete="off">
        <div class="field-note">Stored only in this browser session.</div>
      </div>

      <div class="modal-actions">
        <button onclick="loadFromGist(); closeSettings()">↓ Load</button>
        <button class="primary" onclick="saveToGist(); closeSettings()">↑ Save</button>
      </div>

      <div class="sync-status" id="syncStatus"></div>
      <button class="clear-btn" onclick="clearSyncSettings()">Clear Gist URL</button>
    </div>
  </div>
</div>

<div class="debug-badge" id="debugBadge">v4 · loading</div>

<script src="data.js"></script>
<script>
const CODE_VERSION = 4;

let queue = [];
let current = 0;
let flipped = false;
let filter = 'all';
let status = JSON.parse(localStorage.getItem('gre-status') || '{}');
let syncTimer = null;
let syncBusy = false;

// Race-condition guards:
// - remoteLoadConfigured: true when the app has a Gist URL + token to load from.
// - initialRemoteLoadSettled: true once the initial remote load has finished
//   (or determined not to be needed). No save is allowed until this is true.
let remoteLoadConfigured = false;
let initialRemoteLoadSettled = false;

let allWordsOrder = [];
let currentByFilter = { all: 0, known: 0, unknown: 0 };

const GIST_FILE = 'gre-status.json';
const SESSION_VERSION = 2;
const SYNC_DEBOUNCE_MS = 400;

let session = loadSessionState();
const BAKED_GIST_URL = 'PASTE_YOUR_GIST_URL_HERE';

function defaultSessionState() {
  return {
    version: SESSION_VERSION,
    currentByFilter: { all: 0, known: 0, unknown: 0 },
    filter: 'all',
    flipped: false,
    queue: [],
    allOrder: []
  };
}

function loadSessionState() {
  try {
    const saved = JSON.parse(localStorage.getItem('gre-session') || 'null');
    if (!saved) return defaultSessionState();

    if (saved.version === 1 || saved.version === undefined) {
      const c = Number(saved.current) || 0;
      return {
        version: SESSION_VERSION,
        currentByFilter: { all: c, known: c, unknown: c },
        filter: ['all', 'known', 'unknown'].includes(saved.filter) ? saved.filter : 'all',
        flipped: Boolean(saved.flipped),
        queue: Array.isArray(saved.queue) ? saved.queue : [],
        allOrder: Array.isArray(saved.allOrder) ? saved.allOrder : []
      };
    }

    if (saved.version !== SESSION_VERSION) return defaultSessionState();

    return {
      version: SESSION_VERSION,
      currentByFilter: {
        all: Number(saved.currentByFilter?.all) || 0,
        known: Number(saved.currentByFilter?.known) || 0,
        unknown: Number(saved.currentByFilter?.unknown) || 0
      },
      filter: ['all', 'known', 'unknown'].includes(saved.filter) ? saved.filter : 'all',
      flipped: Boolean(saved.flipped),
      queue: Array.isArray(saved.queue) ? saved.queue : [],
      allOrder: Array.isArray(saved.allOrder) ? saved.allOrder : []
    };
  } catch {
    return defaultSessionState();
  }
}

function initializeAllOrder(savedOrder) {
  const byWord = new Map(GRE_WORDS.map(e => [e.word, e]));
  const result = [];
  const seen = new Set();

  if (Array.isArray(savedOrder)) {
    for (const w of savedOrder) {
      if (byWord.has(w) && !seen.has(w)) {
        result.push(w);
        seen.add(w);
      }
    }
  }

  for (const e of GRE_WORDS) {
    if (!seen.has(e.word)) {
      result.push(e.word);
      seen.add(e.word);
    }
  }

  allWordsOrder = result;
}

function saveSessionState() {
  currentByFilter[filter] = current;

  session = {
    version: SESSION_VERSION,
    currentByFilter: { ...currentByFilter },
    filter,
    flipped,
    queue: queue.map(e => e.word),
    allOrder: allWordsOrder
  };
  localStorage.setItem('gre-session', JSON.stringify(session));
  updateDebugBadge();
}

function applySessionState(saved) {
  if (!saved || saved.version !== SESSION_VERSION) return false;

  initializeAllOrder(saved.allOrder);

  currentByFilter = {
    all: Number(saved.currentByFilter?.all) || 0,
    known: Number(saved.currentByFilter?.known) || 0,
    unknown: Number(saved.currentByFilter?.unknown) || 0
  };

  const byWord = new Map(GRE_WORDS.map(e => [e.word, e]));
  const restoredQueue = Array.isArray(saved.queue)
    ? saved.queue.map(word => byWord.get(word)).filter(Boolean)
    : [];

  if (restoredQueue.length > 0) {
    queue = restoredQueue;
    filter = ['all', 'known', 'unknown'].includes(saved.filter) ? saved.filter : 'all';
    flipped = Boolean(saved.flipped);

    current = Math.min(
      Math.max(currentByFilter[filter] || 0, 0),
      queue.length - 1
    );
    currentByFilter[filter] = current;

    document.querySelectorAll('.filters button').forEach(b =>
      b.classList.toggle('active', b.dataset.filter === filter)
    );

    render();
    return true;
  }

  return false;
}

function updateDebugBadge() {
  const el = document.getElementById('debugBadge');
  if (!el) return;
  const syncTag = initialRemoteLoadSettled ? '✓' : '…';
  el.textContent = `v${CODE_VERSION} ${syncTag} · ${filter[0]}${currentByFilter[filter]} · a${currentByFilter.all}/k${currentByFilter.known}/u${currentByFilter.unknown}`;
}

function setSyncStatus(message, type = '') {
  const el = document.getElementById('syncStatus');
  if (!el) return;
  el.textContent = message;
  el.className = 'sync-status' + (type ? ' ' + type : '');
}

function getSyncConfig() {
  return {
    url: document.getElementById('gistUrl').value.trim(),
    token: document.getElementById('gistToken').value.trim()
  };
}

function gistIdFromUrl(url) {
  const match = url.match(/gist\.github\.com\/(?:[^/]+\/)?([a-f0-9]+)(?:[/?#]|$)/i);
  return match ? match[1] : null;
}

function saveLocalStatus() {
  localStorage.setItem('gre-status', JSON.stringify(status));
}

function saveSyncUrl() {
  localStorage.setItem('gre-gist-url', document.getElementById('gistUrl').value.trim());
}

async function githubRequest(url, options = {}) {
  const { token } = getSyncConfig();
  const headers = {
    'Accept': 'application/vnd.github+json',
    ...options.headers
  };
  if (token) headers['Authorization'] = `Bearer ${token}`;
  return fetch(url, { ...options, headers });
}

function normalizeSession(saved) {
  if (!saved || typeof saved !== 'object') return defaultSessionState();

  if (saved.version === 1 || saved.version === undefined) {
    const c = Number(saved.current) || 0;
    return {
      version: SESSION_VERSION,
      currentByFilter: { all: c, known: c, unknown: c },
      filter: ['all', 'known', 'unknown'].includes(saved.filter) ? saved.filter : 'all',
      flipped: Boolean(saved.flipped),
      queue: Array.isArray(saved.queue) ? saved.queue : [],
      allOrder: Array.isArray(saved.allOrder) ? saved.allOrder : []
    };
  }

  if (saved.version !== SESSION_VERSION) return defaultSessionState();

  return {
    version: SESSION_VERSION,
    currentByFilter: {
      all: Number(saved.currentByFilter?.all) || 0,
      known: Number(saved.currentByFilter?.known) || 0,
      unknown: Number(saved.currentByFilter?.unknown) || 0
    },
    filter: ['all', 'known', 'unknown'].includes(saved.filter) ? saved.filter : 'all',
    flipped: Boolean(saved.flipped),
    queue: Array.isArray(saved.queue) ? saved.queue : [],
    allOrder: Array.isArray(saved.allOrder) ? saved.allOrder : []
  };
}

async function loadFromGist(silent = false) {
  const { url, token } = getSyncConfig();
  const id = gistIdFromUrl(url);

  if (!id) {
    setSyncStatus('Enter a valid gist.github.com URL.', 'err');
    return false;
  }
  if (!token) {
    setSyncStatus('Enter your GitHub PAT to read a private gist or save changes.', 'err');
    return false;
  }

  saveSyncUrl();
  setSyncStatus('Loading from Gist…');

  try {
    const response = await githubRequest(`https://api.github.com/gists/${id}`);
    if (!response.ok) throw new Error(`GitHub API ${response.status}: ${await response.text()}`);

    const gist = await response.json();
    const file =
      gist.files[GIST_FILE] ||
      Object.values(gist.files).find(f => f.filename.endsWith('.json'));

    if (!file) throw new Error('No JSON status file found in this Gist.');

    const remote = JSON.parse(file.content);
    if (!remote || typeof remote.status !== 'object') {
      throw new Error('Gist JSON does not contain a valid "status" object.');
    }

    // Safety check: if remote is empty but we have local data, refuse to
    // overwrite. This protects against a corrupted remote wiping local state.
    const remoteCount = Object.keys(remote.status || {}).length;
    const localCount = Object.keys(status || {}).length;
    if (remoteCount === 0 && localCount > 0) {
      setSyncStatus(`Remote is empty (${localCount} local kept). Not overwriting local state.`, 'ok');
      return false;
    }

    status = remote.status;
    saveLocalStatus();

    if (remote.session) {
      const normalized = normalizeSession(remote.session);
      const restored = applySessionState(normalized);
      if (restored) {
        setSyncStatus(`Loaded ${Object.keys(status).length} statuses and session from Gist.`, 'ok');
        return true;
      }
    }

    buildQueue();
    setSyncStatus(`Loaded ${Object.keys(status).length} statuses from Gist.`, 'ok');
    return true;
  } catch (error) {
    console.error(error);
    setSyncStatus(`Load failed: ${error.message}`, 'err');
    return false;
  }
}

async function saveToGist(silent = false) {
  if (syncBusy) return false;

  const { url, token } = getSyncConfig();
  const id = gistIdFromUrl(url);

  if (!id) {
    setSyncStatus('Enter a valid gist.github.com URL.', 'err');
    return false;
  }
  if (!token) {
    setSyncStatus('Enter your GitHub PAT before saving.', 'err');
    return false;
  }

  saveSyncUrl();
  saveSessionState();

  syncBusy = true;
  if (!silent) setSyncStatus('Saving to Gist…');

  try {
    const payload = {
      files: {
        [GIST_FILE]: {
          content: JSON.stringify({
            version: 2,
            updatedAt: new Date().toISOString(),
            status,
            session
          }, null, 2)
        }
      }
    };

    const response = await githubRequest(`https://api.github.com/gists/${id}`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });

    if (!response.ok) throw new Error(`GitHub API ${response.status}: ${await response.text()}`);

    setSyncStatus(`Saved ${Object.keys(status).length} statuses and session to Gist.`, 'ok');
    return true;
  } catch (error) {
    console.error(error);
    setSyncStatus(`Save failed: ${error.message}`, 'err');
    return false;
  } finally {
    syncBusy = false;
  }
}

function queueGistSave() {
  clearTimeout(syncTimer);
  syncTimer = setTimeout(() => {
    // Block any save until the initial remote load finishes (or is skipped).
    // This is the fix for the race condition that wiped the Gist.
    if (remoteLoadConfigured && !initialRemoteLoadSettled) {
      queueGistSave();  // re-check after another debounce window
      return;
    }
    const { url, token } = getSyncConfig();
    if (url && token) saveToGist(true);
  }, SYNC_DEBOUNCE_MS);
}

function persistState() {
  saveSessionState();
  queueGistSave();
}

function clearSyncSettings() {
  if (!confirm('Clear the saved Gist URL override from this browser?')) return;
  gistUrlInput.value = BAKED_GIST_URL !== 'PASTE_YOUR_GIST_URL_HERE'
    ? BAKED_GIST_URL
    : '';
  localStorage.removeItem('gre-gist-url');
  setSyncStatus('Gist URL reset.');
}

function saveStatus() {
  saveLocalStatus();
  persistState();
}

function buildQueue() {
  if (filter === 'known') {
    queue = GRE_WORDS.filter(e => status[e.word] === 'known');
  } else if (filter === 'unknown') {
    queue = GRE_WORDS.filter(e => status[e.word] === 'unknown');
  } else {
    const byWord = new Map(GRE_WORDS.map(e => [e.word, e]));
    queue = allWordsOrder.map(w => byWord.get(w)).filter(Boolean);
  }

  current = Math.min(
    Math.max(currentByFilter[filter] || 0, 0),
    Math.max(queue.length - 1, 0)
  );
  currentByFilter[filter] = current;

  flipped = false;
  render();
  persistState();
}

function esc(str) {
  if (str == null) return '';
  return String(str)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function relWords(list) {
  if (!Array.isArray(list)) return [];
  return list
    .map(item => {
      if (typeof item === 'string') return item.trim();
      if (item && typeof item === 'object' && item.word) return String(item.word).trim();
      return '';
    })
    .filter(Boolean);
}

function renderWordMeta(e) {
  const parts = [];
  if (e.pronunciation) {
    parts.push(`<span class="pron">${esc(e.pronunciation)}</span>`);
  }
  if (e.pos) {
    parts.push(`<span class="pos">${esc(e.pos)}</span>`);
  }
  if (!parts.length) return '';
  return parts.join('<span class="sep">•</span>');
}

function renderFront(e) {
  const meta = renderWordMeta(e);
  return `
    <div class="front">
      <div class="word">${esc(e.word)}</div>
      ${meta ? `<div class="word-meta">${meta}</div>` : ''}
      <div class="hint">tap to flip • swipe right = known • swipe left = unknown</div>
    </div>`;
}

function renderBack(e) {
  const meta = renderWordMeta(e);
  const syns = relWords(e.synonyms);
  const ants = relWords(e.antonyms);

  const synChips = syns.map(w => `<span class="chip syn">${esc(w)}</span>`).join('');
  const antChips = ants.map(w => `<span class="chip ant">${esc(w)}</span>`).join('');

  return `
    <div class="back">
      <div class="word-header">
        <div class="word">${esc(e.word)}</div>
        ${meta ? `<div class="word-meta">${meta}</div>` : ''}
      </div>

      <div class="section">
        <div class="section-label">Meaning</div>
        <div class="section-value meaning">${esc(e.meaning)}</div>
      </div>

      ${e.mnemonic ? `
        <div class="section">
          <div class="section-label">🧠 Memory trick</div>
          <div class="section-value mnemonic">${esc(e.mnemonic)}</div>
        </div>` : ''}

      ${e.usage ? `
        <div class="section">
          <div class="section-label">Usage</div>
          <div class="section-value usage">"${esc(e.usage)}"</div>
        </div>` : ''}

      ${synChips ? `
        <div class="section">
          <div class="section-label">Synonyms</div>
          <div class="chip-row">${synChips}</div>
        </div>` : ''}

      ${antChips ? `
        <div class="section">
          <div class="section-label">${ants.length > 1 ? 'Antonyms' : 'Antonym'}</div>
          <div class="chip-row">${antChips}</div>
        </div>` : ''}
    </div>`;
}

function render() {
  const cardContent = document.getElementById('cardContent');
  const knownCount = Object.values(status).filter(v => v === 'known').length;
  const unknownCount = Object.values(status).filter(v => v === 'unknown').length;

  document.getElementById('stats').textContent =
    `${queue.length ? current + 1 : 0} / ${queue.length}  •  ✓${knownCount}  ✗${unknownCount}`;

  document.getElementById('progress').style.width =
    queue.length ? ((current + 1) / queue.length * 100) + '%' : '0%';

  if (!queue.length) {
    cardContent.innerHTML = '<div class="front"><div class="word">No cards</div><div class="hint">Change filter or reset</div></div>';
    updateDebugBadge();
    return;
  }

  const e = queue[current];
  cardContent.innerHTML = flipped ? renderBack(e) : renderFront(e);

  document.getElementById('knownBtn').classList.toggle('active', status[e.word] === 'known');
  document.getElementById('unknownBtn').classList.toggle('active', status[e.word] === 'unknown');
  updateDebugBadge();
}

function flip() {
  if (!queue.length || swipeCommitting) return;
  flipped = !flipped;
  persistState();
  render();
}

function next() {
  if (!queue.length) return;
  current = (current + 1) % queue.length;
  currentByFilter[filter] = current;
  flipped = false;
  persistState();
  render();
}

function prev() {
  if (!queue.length) return;
  current = (current - 1 + queue.length) % queue.length;
  currentByFilter[filter] = current;
  flipped = false;
  persistState();
  render();
}

function mark(s) {
  if (!queue.length) return;
  const e = queue[current];

  if (status[e.word] === s) delete status[e.word];
  else status[e.word] = s;

  saveStatus();
  next();
}

function shuffleArray(arr) {
  const out = arr.slice();
  for (let i = out.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [out[i], out[j]] = [out[j], out[i]];
  }
  return out;
}

function shuffle() {
  if (filter === 'all') {
    allWordsOrder = shuffleArray(allWordsOrder);
    const byWord = new Map(GRE_WORDS.map(e => [e.word, e]));
    queue = allWordsOrder.map(w => byWord.get(w)).filter(Boolean);
  } else {
    queue = shuffleArray(queue);
  }

  current = 0;
  currentByFilter[filter] = 0;
  flipped = false;
  persistState();
  render();
}

function reset() {
  if (!confirm('Reset all progress?')) return;

  status = {};
  saveLocalStatus();

  initializeAllOrder([]);
  currentByFilter = { all: 0, known: 0, unknown: 0 };
  filter = 'all';
  current = 0;
  flipped = false;

  buildQueue();
}

function setFilter(f) {
  if (f === filter) return;

  currentByFilter[filter] = current;
  filter = f;

  document.querySelectorAll('.filters button').forEach(b =>
    b.classList.toggle('active', b.dataset.filter === f)
  );

  buildQueue();
}

// --- Swipe visual feedback ---
const TOUCH_THRESHOLD = 60;
const TOUCH_MAX = 110;
const WHEEL_THRESHOLD = 90;
const WHEEL_MAX = 220;
const COMMIT_FLASH_MS = 260;
const WHEEL_LOCK_MS = 260;

const ICON_PATHS = {
  known: 'M 22 52 L 44 74 L 80 26',
  unknown: 'M 26 26 L 74 74 M 74 26 L 26 74'
};

let swipeCommitting = false;

function setSwipeIcon(direction) {
  const path = document.getElementById('swipeIconPath');
  if (path) path.setAttribute('d', ICON_PATHS[direction] || '');
}

function updateSwipeVisual(dx, max) {
  const overlay = document.getElementById('swipeOverlay');
  const icon = document.getElementById('swipeIcon');
  if (!overlay || !icon) return;

  const absDx = Math.abs(dx);

  if (absDx < 6) {
    overlay.style.background = 'transparent';
    icon.style.opacity = '0';
    return;
  }

  const raw = Math.min(1, absDx / max);
  const intensity = Math.pow(raw, 0.7);

  const bgAlpha = intensity;
  const iconAlpha = Math.min(1, intensity * 1.5);

  if (dx > 0) {
    overlay.style.background = `rgba(16, 185, 129, ${bgAlpha})`;
    setSwipeIcon('known');
  } else {
    overlay.style.background = `rgba(220, 38, 38, ${bgAlpha})`;
    setSwipeIcon('unknown');
  }

  icon.style.opacity = String(iconAlpha);
}

function resetSwipeVisual() {
  const overlay = document.getElementById('swipeOverlay');
  const icon = document.getElementById('swipeIcon');
  if (overlay) overlay.style.background = 'transparent';
  if (icon) icon.style.opacity = '0';
}

function commitSwipe(direction) {
  if (swipeCommitting) return;
  swipeCommitting = true;

  const overlay = document.getElementById('swipeOverlay');
  const icon = document.getElementById('swipeIcon');

  if (direction === 'known') {
    overlay.style.background = 'rgb(16, 185, 129)';
    setSwipeIcon('known');
  } else {
    overlay.style.background = 'rgb(220, 38, 38)';
    setSwipeIcon('unknown');
  }
  icon.style.opacity = '1';

  void overlay.offsetHeight;
  void icon.offsetHeight;

  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      setTimeout(() => {
        mark(direction);
        resetSwipeVisual();
        swipeCommitting = false;
      }, COMMIT_FLASH_MS);
    });
  });
}

const cardElement = document.getElementById('card');

let touchStartX = 0;
let touchStartY = 0;
let touchStartTime = 0;
let touchMoved = false;
let touchInteraction = false;

cardElement.addEventListener('touchstart', event => {
  if (!event.touches.length) return;
  if (swipeCommitting) return;

  touchInteraction = true;

  const touch = event.touches[0];
  touchStartX = touch.clientX;
  touchStartY = touch.clientY;
  touchStartTime = Date.now();
  touchMoved = false;
}, { passive: true });

cardElement.addEventListener('touchmove', event => {
  if (!event.touches.length) return;
  if (swipeCommitting) return;

  const touch = event.touches[0];
  const dx = touch.clientX - touchStartX;
  const dy = touch.clientY - touchStartY;

  if (Math.abs(dx) > 10 || Math.abs(dy) > 10) {
    touchMoved = true;
  }

  if (Math.abs(dx) > Math.abs(dy)) {
    updateSwipeVisual(dx, TOUCH_MAX);
  } else if (Math.abs(dy) > 10) {
    resetSwipeVisual();
  }
}, { passive: true });

cardElement.addEventListener('touchend', event => {
  if (!touchStartTime) return;
  if (swipeCommitting) return;

  const touch = event.changedTouches[0];
  const dx = touch.clientX - touchStartX;
  const dy = touch.clientY - touchStartY;
  const duration = Date.now() - touchStartTime;

  touchStartTime = 0;

  const horizontalDistance = Math.abs(dx);
  const verticalDistance = Math.abs(dy);

  const isHorizontalSwipe =
    horizontalDistance >= TOUCH_THRESHOLD &&
    horizontalDistance > verticalDistance * 1.15 &&
    duration <= 900;

  if (isHorizontalSwipe) {
    if (dx > 0) commitSwipe('known');
    else commitSwipe('unknown');
    return;
  }

  resetSwipeVisual();

  if (!touchMoved && duration <= 500) {
    flip();
  }
}, { passive: true });

let wheelAccum = 0;
let wheelQuietTimer = null;
let wheelLocked = false;

function armWheelLock() {
  wheelLocked = true;
  wheelAccum = 0;
  clearTimeout(wheelQuietTimer);
  wheelQuietTimer = setTimeout(() => {
    wheelLocked = false;
    resetSwipeVisual();
  }, WHEEL_LOCK_MS);
}

cardElement.addEventListener('wheel', event => {
  const { deltaX, deltaY, momentumPhase } = event;

  if (wheelLocked) {
    clearTimeout(wheelQuietTimer);
    wheelQuietTimer = setTimeout(() => {
      wheelLocked = false;
      resetSwipeVisual();
    }, WHEEL_LOCK_MS);
    return;
  }

  if (swipeCommitting) return;
  if (momentumPhase && momentumPhase !== 'none') return;

  if (Math.abs(deltaX) <= Math.abs(deltaY) * 1.15) {
    if (wheelAccum !== 0) {
      wheelAccum = 0;
      clearTimeout(wheelQuietTimer);
      resetSwipeVisual();
    }
    return;
  }

  event.preventDefault();

  wheelAccum -= deltaX;
  updateSwipeVisual(wheelAccum, WHEEL_MAX);

  if (Math.abs(wheelAccum) >= WHEEL_THRESHOLD) {
    const dir = wheelAccum > 0 ? 'known' : 'unknown';
    armWheelLock();
    commitSwipe(dir);
    return;
  }

  clearTimeout(wheelQuietTimer);
  wheelQuietTimer = setTimeout(() => {
    wheelAccum = 0;
    resetSwipeVisual();
  }, 220);
}, { passive: false });

cardElement.addEventListener('click', () => {
  if (touchInteraction) {
    touchInteraction = false;
    return;
  }
  flip();
});

document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;

  if (e.code === 'Space') {
    e.preventDefault();
    flip();
  } else if (e.key === 'ArrowRight') {
    next();
  } else if (e.key === 'ArrowLeft') {
    prev();
  } else if (e.key === '1') {
    mark('known');
  } else if (e.key === '2') {
    mark('unknown');
  } else if (e.key === 'Escape') {
    closeSettings();
  }
});

const gistUrlInput = document.getElementById('gistUrl');
const gistTokenInput = document.getElementById('gistToken');

gistUrlInput.value = BAKED_GIST_URL !== 'PASTE_YOUR_GIST_URL_HERE'
  ? BAKED_GIST_URL
  : (localStorage.getItem('gre-gist-url') || '');

gistTokenInput.value = sessionStorage.getItem('gre-gist-token') || '';

gistUrlInput.addEventListener('change', saveSyncUrl);
gistTokenInput.addEventListener('change', e => {
  sessionStorage.setItem('gre-gist-token', e.target.value.trim());
});

function openSettings() {
  document.getElementById('settingsModal').classList.add('open');
  gistTokenInput.focus();
}

function closeSettings() {
  document.getElementById('settingsModal').classList.remove('open');
}

function closeSettingsOnBackdrop(event) {
  if (event.target.id === 'settingsModal') closeSettings();
}

// ---------- Initialization ----------
console.info('[GRE 1000] Loading code version', CODE_VERSION);

if (typeof GRE_WORDS === 'undefined' || !Array.isArray(GRE_WORDS)) {
  document.getElementById('cardContent').innerHTML =
    '<div class="error">Could not load data.js. Make sure data.js is in the same folder and defines <code>GRE_WORDS</code>.</div>';
  document.getElementById('stats').textContent = 'error';
} else {
  const localSession = loadSessionState();
  console.info('[GRE 1000] Loaded session:', localSession);

  if (!applySessionState(localSession)) {
    buildQueue();
  }

  const url = document.getElementById('gistUrl').value;
  const token = document.getElementById('gistToken').value;

  if (url && token) {
    // Mark that a remote load is pending so no save fires until it settles.
    remoteLoadConfigured = true;
    loadFromGist(true).finally(() => {
      initialRemoteLoadSettled = true;
      updateDebugBadge();
    });
  } else {
    // No remote configured — no need to wait for anything.
    initialRemoteLoadSettled = true;
    updateDebugBadge();
  }
}
</script>

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./sw.js").catch(err => {
      console.warn("Service worker registration failed:", err);
    });
  });
}
</script>
